<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161f; overflow: hidden; font-family: system-ui, sans-serif; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #14161f; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #9aa0b0; font-size: 14px; }
    #bar { width: 200px; height: 6px; background: #2a2e3b; border-radius: 3px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #f2c14e; transition: width .2s; }
    #error { color: #ff8080; max-width: 80%; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><div>Loading…</div><div id="bar"><div id="fill"></div></div><div id="error"></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };
    createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
      document.querySelector("#fill").style.width = (100 * p) + "%";
    }).then(function () {
      document.querySelector("#loader").remove();
    }).catch(function (e) {
      document.querySelector("#error").textContent = e;
    });
  </script>
</body>
</html>
