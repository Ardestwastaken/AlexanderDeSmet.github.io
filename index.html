<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alexander De Smet · Portfolio</title>
  <style>
    :root { --bg: #0f1117; --card: #181b24; --text: #e8e9ee; --muted: #9aa0b0; --accent: #f2c14e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    main { max-width: 1040px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 2.2rem; }
    .sub { color: var(--muted); margin: 0 0 40px; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .card h2 { margin: 0 0 6px; font-size: 1.3rem; }
    .card p { margin: 0 0 16px; color: var(--muted); }
    .frame { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; background: #000; }
    .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Alexander De Smet</h1>
    <p class="sub">Portfolio</p>

    <section class="card">
      <h2>Unity WebGL Test</h2>
      <p>A small interactive 3D scene built in Unity 6. Drag to orbit, scroll to zoom, click a shape.
        <a href="projects/unity-test/">Open full page</a></p>
      <div class="frame">
        <iframe src="projects/unity-test/" title="Unity WebGL test" loading="lazy" allowfullscreen></iframe>
      </div>
    </section>
  </main>
</body>
</html>
